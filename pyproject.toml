[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-notifier-hub"
version = "0.1.0.dev0"
description = "Turn a persisted Notification row into a delivered email, SMS or in-site message, with an audit trail of every attempt. PostgreSQL only."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ck-tech-nz" }]
keywords = ["django", "notifications", "email", "sms", "celery", "postgresql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

# Django only. psycopg is supplied by the host project, which already needs it
# to run Django on PostgreSQL at all (PRD 2.9).
dependencies = ["Django>=5.2.8"]

[project.optional-dependencies]
celery = ["celery>=5.4"]

[project.urls]
Homepage = "https://github.com/ck-tech-nz/django-notifier-hub"
Repository = "https://github.com/ck-tech-nz/django-notifier-hub"
Issues = "https://github.com/ck-tech-nz/django-notifier-hub/issues"
Changelog = "https://github.com/ck-tech-nz/django-notifier-hub/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  # For example/ only: kombu's redis transport needs the client library. The
  # package itself stays Django-only, and a user bringing Celery brings their
  # own broker driver.
  "redis>=5.0",
  "psycopg[binary]>=3.2",
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]

[tool.hatch.build.targets.sdist]
include = ["src/notifier", "tests", "README.md", "PRD.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# src/ layout: notifier is installed, but tests/ lives at the repo root and has
# to be importable as a package for the settings module path to resolve.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
  "headless: passes under tests.settings_minimal (INSTALLED_APPS = ['notifier'])",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # bugbear
  "C4",     # comprehensions
  "DJ",     # flake8-django
  "RUF",
]
ignore = [
  # `from __future__ import annotations` is banned (PRD 9); do not let
  # pyupgrade or bugbear suggest it.
  "UP037",
  # Django declarative classes are built out of mutable class attributes --
  # Meta.constraints, Meta.indexes, ModelAdmin.list_display, actions. Annotating
  # every one as ClassVar is noise, not safety.
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Generated by makemigrations and never hand-edited (PRD 9).
"src/notifier/migrations/*" = ["E501"]

[tool.coverage.run]
source = ["notifier"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
